```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Delete Scholarship - Learnova
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            LEARNOVA ADMIN
        </div>

        <div class="nav-links">

            <a href="/admin-dashboard">
                Dashboard
            </a>

            <a href="/admin/applications">
                Applications
            </a>

            <a href="/admin/scholarships">
                Scholarships
            </a>

            <a href="/admin-logout">
                Logout
            </a>

        </div>

    </nav>


    <section class="dashboard">

        <div class="feature-card"
             style="
                max-width: 600px;
                margin: 50px auto;
                text-align: center;
             ">

            <h1>
                ⚠️ Delete Scholarship
            </h1>

            <p>
                Are you sure you want to delete this scholarship?
            </p>

            <h2>
                🎓 {{ scholarship[1] }}
            </h2>

            <p>
                <strong>
                    Category:
                </strong>

                {{ scholarship[2] }}
            </p>

            <p>
                This action cannot be undone.
            </p>


            <br>


            <form
                method="POST"
                action="/admin/scholarship/delete/{{ scholarship[0] }}"
            >

                <button
                    type="submit"
                    style="
                        margin-right: 10px;
                    "
                >
                    🗑️ Yes, Delete
                </button>

                <a href="/admin/scholarships">

                    <button type="button">
                        Cancel
                    </button>

                </a>

            </form>

        </div>

    </section>

</body>

</html>
```
